name: tva

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no funds moved, no log entries written)?'
        type: boolean
        default: false
      debug:
        description: 'Debug mode (verbose logging)?'
        type: boolean
        default: true
      blockchain:
        description: 'Which chain (data/{blockchain}.toml) to trade against?'
        type: string
        default: 'avalanche'
      btc_trade_amount:
        description: 'BTC amount to open a new BTC->UNDEAD position with each cycle'
        type: string
        default: '0.005'
      undead_trade_amount:
        description: 'UNDEAD amount to open a new UNDEAD->BTC position with each cycle'
        type: string
        default: '500000'
      log_path:
        description: 'Full trade log path. Leave blank for the default (trading/data/tva-trades.log under the runner workspace).'
        type: string
        default: ''
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: tva
  cancel-in-progress: false

env:
  DAPP: tva

permissions:
  contents: write

jobs:
  run-tva:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trading
        uses: actions/checkout@v4
        with:
          path: trading

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: pivoteur/protocol
          path: protocol
          ref: main

      - name: Load Shared Environment Variables
        uses: doughepi/yaml-env-action@v1.0.0
        with:
          files: trading/.github/config/trading-env.yml

      - name: Establish app path
        run: echo "DAPP_DIR=$DAPPS_DIR/$DAPP" >> $GITHUB_ENV

      - name: Establish git path
        run: echo "GIT_DAPP_DIR=$GITHUB_PATH/$DAPP_DIR" >> $GITHUB_ENV

      - name: Normalize workflow inputs
        # workflow_dispatch defaults do NOT apply on the schedule trigger --
        # github.event.inputs (and the inputs.* context) is empty there.
        # Every later step reads ONLY these normalized env.* values, never
        # raw inputs.* / github.event.inputs.*, so a manual run and an
        # hourly scheduled run resolve to identical values.
        run: |
          echo "DRY_RUN=${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_ENV
          echo "DEBUG=${{ github.event.inputs.debug || 'true' }}" >> $GITHUB_ENV
          echo "BLOCKCHAIN=${{ github.event.inputs.blockchain || 'avalanche' }}" >> $GITHUB_ENV
          echo "BTC_TRADE_AMOUNT=${{ github.event.inputs.btc_trade_amount || '0.005' }}" >> $GITHUB_ENV
          echo "UNDEAD_TRADE_AMOUNT=${{ github.event.inputs.undead_trade_amount || '500000' }}" >> $GITHUB_ENV
          echo "LOG_PATH_INPUT=${{ github.event.inputs.log_path || '' }}" >> $GITHUB_ENV

      - name: Establish trade log path
        # tva's --log-path is a required, CLI-only runtime
        # argument -- no env fallback
        run: echo "TVA_LOG_PATH=${LOG_PATH_INPUT:-$GITHUB_WORKSPACE/trading/data/tva-trades.log}" >> $GITHUB_ENV

      - name: Cache tva binary
        id: binary-cache
        uses: actions/cache@v4
        with:
          path: trading/dapps/tva/target/release/tva
          key: >-
            tva-binary-
            ${{ hashFiles(format('{0}/quiz01/a_tva/mod.rs', env.QUIZZES_SRC)) }}-
            ${{ hashFiles('trading/libs/src/auto_trading.rs') }}-
            ${{ hashFiles(format('{0}/Cargo.toml', env.DAPP_DIR)) }}-
            ${{ hashFiles(format('{0}/Cargo.lock', env.DAPP_DIR)) }}

      - name: Install Rust toolchain
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Checkout crypto-n-rust
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: logicalgraphs/crypto-n-rust
          path: crypto-n-rust

      - name: Show input parameters
        run: |
          echo "=== Running tva with resolved inputs (manual or scheduled) ==="
          echo "dry_run: $DRY_RUN"
          echo "debug: $DEBUG"
          echo "blockchain: $BLOCKCHAIN"
          echo "btc_trade_amount: $BTC_TRADE_AMOUNT"
          echo "undead_trade_amount: $UNDEAD_TRADE_AMOUNT"
          echo "log_path: $TVA_LOG_PATH"

      - name: Build tva
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --manifest-path $DAPP_DIR/Cargo.toml --bin $DAPP --release

      - name: Add tva to PATH
        run: echo "$DAPP_DIR/$EXE_SUBDIR" >> $GITHUB_PATH

      - name: Write keystore file from secret
        env:
          TVA_KEYSTORE_JSON: ${{ secrets.TVA_KEYSTORE_JSON }}
        run: |
          if [ -z "$TVA_KEYSTORE_JSON" ]; then
            echo "::error::TVA_KEYSTORE_JSON secret is empty -- refusing to write an empty keystore file. Set the TVA_KEYSTORE_JSON repo secret before running this workflow."
            exit 1
          fi
          echo "$TVA_KEYSTORE_JSON" > "$RUNNER_TEMP/tva-keystore.json"
          echo "TVA_KEYSTORE_PATH=$RUNNER_TEMP/tva-keystore.json" >> $GITHUB_ENV

      - name: Run tva
        env:
          TVA_WALLET_ADDRESS:  ${{ secrets.TVA_WALLET_ADDRESS }}
          KEYSTORE_PASSWORD:   ${{ secrets.TVA_KEYSTORE_PASSWORD }}
          VAULT_ADDRESS:       ${{ secrets.VAULT_ADDRESS }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$DEBUG" = "true" ]; then
            ARGS="$ARGS --debug"
          fi
          if [ -n "$BLOCKCHAIN" ]; then
            ARGS="$ARGS --blockchain $BLOCKCHAIN"
          fi
          if [ -n "$BTC_TRADE_AMOUNT" ]; then
            ARGS="$ARGS --btc-trade-amount $BTC_TRADE_AMOUNT"
          fi
          if [ -n "$UNDEAD_TRADE_AMOUNT" ]; then
            ARGS="$ARGS --undead-trade-amount $UNDEAD_TRADE_AMOUNT"
          fi
          if [ -n "$TVA_LOG_PATH" ]; then
            ARGS="$ARGS --log-path $TVA_LOG_PATH"
          fi
          ARGS="$ARGS div --pct 25"
          echo "=== Running tva with args: $ARGS ==="
          $DAPP $ARGS

      - name: Show new trade log lines (safety net if the commit step doesn't run)
        # if: always() so this still runs even if "Run tva" failed or a
        # later step blows up before the commit step gets there -- a row
        # that was really appended to the log file must never only exist
        # on the runner's disk, which is gone once the job ends.
        if: always()
        run: |
          cd trading
          NEW_LINES=$(git diff --unified=0 -- "$TVA_LOG_PATH" | grep -E '^\+[^+]' || true)
          if [ -n "$NEW_LINES" ]; then
            echo "=== New trade log line(s) this run (not yet committed) ==="
            echo "$NEW_LINES"
          else
            echo "No new trade log lines this run."
          fi

      - name: Delete keystore file
        if: always()
        run: rm -f "$RUNNER_TEMP/tva-keystore.json"

      - name: Commit trade log to trading
        # Explicit success() so a failure earlier in the job (which would
        # already implicitly skip this step) can never be masked by a
        # future edit to this condition -- only commit on a clean,
        # non-dry-run run.
        if: ${{ success() && env.DRY_RUN != 'true' }}
        env:
          USER0_NAME:     ${{ vars.USER0_NAME }}
          USER0_EMAIL:    ${{ secrets.USER0_EMAIL }}
        run: |
          cd trading
          git config --local user.name "$USER0_NAME"
          git config --local user.email "$USER0_EMAIL"
          git add "$TVA_LOG_PATH"

          if git diff --staged --quiet; then
            echo "Nothing to commit, skipping push"
            exit 0
          fi

          git commit -m "tva trade log update [skip ci]"
          git push
