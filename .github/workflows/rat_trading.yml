name: rat_trading

on:
  workflow_dispatch:
  schedule:
    # ("Min Hour Day Month DayofWeek" in UTC) at a scheduled time
    - cron: "23 01 * * *" # runs at the same time as protocol's rat.yml

permissions:
  contents: write

jobs:
  run_all_trading_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trading
        uses: actions/checkout@v4
        with:
          path: trading

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: pivoteur/protocol
          path: protocol

      - name: Checkout crypto-n-rust
        uses: actions/checkout@v4
        with:
          repository: logicalgraphs/crypto-n-rust
          path: crypto-n-rust

      - name: Checkout pivoteur.github.io
        uses: actions/checkout@v4
        with:
          repository: pivoteur/pivoteur.github.io
          path: pivoteur.github.io

      - name: Cache itr binary
        id: itr-cache
        uses: actions/cache@v3
        with:
          path: protocol/dapps/itr/target/release/itr
          key: itr-binary-${{ hashFiles('protocol/quizzes/src/quiz09/a_itr/**/*.rs', 'protocol/dapps/itr/Cargo.toml', 'protocol/dapps/itr/Cargo.lock') }}

      - name: Cache cargo-make binary
        id: make-cache
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cargo-make
          key: cargo-make-${{ runner.os }}

      - name: Cache cargo-tarpaulin binary
        id: tarpaulin-cache
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-make
        if: steps.make-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-make

      - name: Install cargo-tarpaulin
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin

      - name: Verify checkouts
        run: |
            test -d trading/.git           || (echo "ERROR: trading           not checked out" && exit 1)
            test -d protocol/.git          || (echo "ERROR: protocol          not checked out" && exit 1)
            test -d crypto-n-rust/.git     || (echo "ERROR: crypto-n-rust     not checked out" && exit 1)
            test -d pivoteur.github.io/.git || (echo "ERROR: pivoteur.github.io not checked out" && exit 1)
            echo "All checkouts verified."

      - name: Add pivot_data_dir and pivot_url to env
        run: |
          echo "PIVOT_DATA_DIR=$GITHUB_WORKSPACE/pivoteur.github.io/data" >> $GITHUB_ENV
          echo "PIVOT_URL=https://raw.githubusercontent.com/pivoteur/pivoteur.github.io" >> $GITHUB_ENV

      - name: "[trading] cargo tarpaulin — libs"
        working-directory: trading/libs
        run: |
            cargo tarpaulin 2>&1 | tee /tmp/trading_tarp.txt
            if grep -q 'test result: FAILED' /tmp/trading_tarp.txt; then
              echo "--- [trading] TESTS FAILED | $(grep 'coverage' /tmp/trading_tarp.txt | tail -1)" | tee -a /tmp/trading_tarp.txt
              exit 1
            else
              echo "--- [trading] All tests passed | $(grep 'coverage' /tmp/trading_tarp.txt | tail -1)" | tee -a /tmp/trading_tarp.txt
            fi

      - name: "[quizzes:trading] cargo make tests — quizzes"
        working-directory: trading/quizzes
        run: |
            cargo make tests 2>&1 | tee /tmp/quizzes_test.txt
            if grep -q 'test result: FAILED' /tmp/quizzes_test.txt; then
              echo "--- [quizzes:trading] TESTS FAILED | $(grep 'test result' /tmp/quizzes_test.txt | tail -1)" | tee -a /tmp/quizzes_test.txt
              exit 1
            else
              echo "--- [quizzes:trading] All tests passed | $(grep 'test result' /tmp/quizzes_test.txt | tail -1)" | tee -a /tmp/quizzes_test.txt
            fi

      - name: "[quizzes:trading] cargo tarpaulin — quizzes"
        working-directory: trading/quizzes
        run: |
            cargo tarpaulin 2>&1 | tee /tmp/quizzes_tarp.txt
            if grep -q 'test result: FAILED' /tmp/quizzes_tarp.txt; then
              echo "--- [quizzes:trading] TESTS FAILED | $(grep 'coverage' /tmp/quizzes_tarp.txt | tail -1)" | tee -a /tmp/quizzes_tarp.txt
              exit 1
            else
              echo "--- [quizzes:trading] All tests passed | $(grep 'coverage' /tmp/quizzes_tarp.txt | tail -1)" | tee -a /tmp/quizzes_tarp.txt
            fi

      - name: Build itr
        if: steps.itr-cache.outputs.cache-hit != 'true'
        working-directory: protocol/dapps/itr
        run: cargo build --release

      - name: Add itr to PATH
        run: echo "$GITHUB_WORKSPACE/protocol/dapps/itr/target/release" >> $GITHUB_PATH

      - name: "[itr:trading] itr . — dapps"
        working-directory: trading/dapps
        run: |
            itr . 2>&1 | tee /tmp/dapps_itr.txt
            echo "--- [dapps:trading] $(grep 'total:' /tmp/dapps_itr.txt | tail -1)"

      - name: Define log_dir
        run: echo "LOG_DIR=$GITHUB_WORKSPACE/trading/data" >> $GITHUB_ENV

      - name: Define log file path
        run: echo "LOG=$LOG_DIR/diagnostics.txt" >> $GITHUB_ENV

      - name: Write diagnostics log
        run: |
          echo "=== RAT Diagnostics Log ($(date -u)) ===" > $LOG
          echo "" >> $LOG

          export LOG

          write_tarp() {
            local label=$1 file=$2
            local cov=$(grep -oP '[\d.]+(?=% coverage)' $file | tail -1)
            local pass=$(grep -oP '\d+(?= passed)' $file | sort -n | tail -1)
            local fail=$(grep -oP '\d+(?= failed)' $file | sort -n | tail -1)
            local lines=$(grep -oP '\d+/\d+(?= lines)' $file | tail -1)
            local status=$(grep -qE -- "--- \[$label\] TESTS FAILED" $file && echo 'TESTS FAILED' || echo 'All tests passed')
            echo "--- [$label] ${status} | ${cov:-?}% coverage | ${pass:-0} passed, ${fail:-0} failed | lines: ${lines:-?}" >> $LOG
            grep -A1 'failures:' $file | grep '::' >> $LOG || true
            echo "" >> $LOG
          }

          write_tarp trading /tmp/trading_tarp.txt

          QUIZZES_PASS=$(grep -oP '\d+(?= passed)' /tmp/quizzes_test.txt | sort -n | tail -1)
          QUIZZES_FAIL=$(grep -oP '\d+(?= failed)' /tmp/quizzes_test.txt | sort -n | tail -1)
          QUIZZES_STATUS=$(grep -qE 'TESTS FAILED' /tmp/quizzes_test.txt && echo 'TESTS FAILED' || echo 'All tests passed')
          echo "--- [quizzes:trading] test-flow | ${QUIZZES_STATUS} | ${QUIZZES_PASS:-0} passed, ${QUIZZES_FAIL:-0} failed" >> $LOG
          grep -A1 'failures:' /tmp/quizzes_test.txt | grep '::' >> $LOG || true
          echo "" >> $LOG

          write_tarp quizzes:trading /tmp/quizzes_tarp.txt

          echo "--- [dapps:trading] itr" >> $LOG
          grep 'total:' /tmp/dapps_itr.txt | tail -1 >> $LOG || echo "  (no result)" >> $LOG

      - name: Commit diagnostics log to trading
        env:
          USER0_NAME: ${{ vars.USER0_NAME }}
          USER0_EMAIL: ${{ secrets.USER0_EMAIL }}
        run: |
          cd trading
          git config user.name "$USER0_NAME"
          git config user.email "$USER0_EMAIL"
          git add data/diagnostics.txt
          git commit -m "r.a.t. on trading - diagnostic log [skip ci]" || echo "No changes to commit"
          git push
